name: Monitor CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: monitor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: [self-hosted, linux, x64, homeserver]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulse/monitor-service test --reporter=default --reporter=junit --outputFile.junit=reports/vitest.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: monitor-junit
          path: apps/monitor-service/reports/vitest.xml
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Qualité
    runs-on: [self-hosted, linux, x64, homeserver]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint --format json --output-file reports/eslint.json
      - name: Prettier
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p reports
          pnpm format:check 2>&1 | tee reports/prettier.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: monitor-quality
          path: |
            reports/eslint.json
            reports/prettier.txt
          if-no-files-found: warn
          retention-days: 14

  image:
    name: Image Docker
    needs: [tests, quality]
    runs-on: [self-hosted, linux, x64, homeserver]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/monitor-service/Dockerfile
          push: false
          load: true
          tags: pulse-monitor:ci
          cache-from: type=gha,scope=monitor-service
          cache-to: type=gha,scope=monitor-service,mode=max
