name: Mesh smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mesh-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minikube-smoke:
    name: Minikube smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Minikube
        uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21
        with:
          cpus: 2
          memory: 4000

      - name: Build monitor image in Minikube
        run: |
          minikube image build \
            -t pulse/monitor-service:ci \
            -f apps/monitor-service/Dockerfile \
            .

      - name: Deploy CI smoke stack
        run: kubectl apply -f infra/k8s/ci-smoke.yaml

      - name: Wait for pods
        run: |
          kubectl wait --for=condition=available --timeout=180s deployment/postgres
          kubectl wait --for=condition=available --timeout=180s deployment/monitor-service
          kubectl get pods

      - name: Exercise monitor API
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_seconds: 20
          max_attempts: 6
          command: |
            URL="$(minikube service monitor-service --url)"
            curl -fsS "${URL}/health"
            curl -fsS -X POST "${URL}/monitors" \
              -H 'content-type: application/json' \
              -d '{"name":"CI","url":"https://example.com","intervalSeconds":30}'
