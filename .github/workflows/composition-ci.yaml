name: Composition CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: composition-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  SERVICE: composition-service

jobs:
  tests:
    name: Tests
    runs-on: [self-hosted, linux, x64, homeserver]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulse/composition-service test --reporter=default --reporter=junit --outputFile.junit=reports/vitest.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: composition-junit
          path: apps/composition-service/reports/vitest.xml
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Qualité
    runs-on: [self-hosted, linux, x64, homeserver]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint --format json --output-file reports/eslint-composition.json
      - name: Prettier
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p reports
          pnpm format:check 2>&1 | tee reports/prettier-composition.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: composition-quality
          path: |
            reports/eslint-composition.json
            reports/prettier-composition.txt
          if-no-files-found: warn
          retention-days: 14

  image:
    name: Image Docker
    needs: [tests, quality]
    runs-on: [self-hosted, linux, x64, homeserver]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image coordinates
        id: meta
        shell: bash
        run: |
          owner_repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="${{ env.REGISTRY }}/${owner_repo}/${{ env.SERVICE }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:sha-${GITHUB_SHA::12}"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "${image}:pr-${{ github.event.pull_request.number }}"
            fi
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/composition-service/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=composition-service
          cache-to: type=gha,scope=composition-service,mode=max

  supply-chain:
    name: Supply chain
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: [self-hosted, linux, x64, homeserver]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image by digest
        env:
          IMAGE_REF: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          format: spdx-json
          output-file: composition-service.sbom.spdx.json
          artifact-name: composition-service-sbom
          upload-artifact-retention: 7

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.image.outputs.image }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.image.outputs.image }}
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: composition-service.sbom.spdx.json
          push-to-registry: true

      - name: Verify signature and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/composition-ci.yaml@refs/heads/main
        run: |
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF"
          gh attestation verify "oci://$IMAGE_REF" --repo "$GITHUB_REPOSITORY"

      - name: Scan published digest with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          format: sarif
          output: trivy-composition.sarif

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-composition.sarif
          category: trivy-composition-service
