name: Secrets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret detection
    runs-on: [self-hosted, linux, x64, homeserver]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks
        run: |
          mkdir -p reports
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --mount "type=bind,source=$PWD/reports,target=/reports" \
            zricethezav/gitleaks:v8.30.0 git /repo \
            --log-opts="--all HEAD" \
            --redact=100 --report-format json --report-path /reports/gitleaks.json
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: monitor-gitleaks
          path: reports/gitleaks.json
          if-no-files-found: warn
          retention-days: 14
