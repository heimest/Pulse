services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pulse_pg_data:/var/lib/postgresql/data

  monitor-service:
    build:
      context: .
      dockerfile: apps/monitor-service/Dockerfile
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  checker-service:
    build:
      context: .
      dockerfile: apps/checker-service/Dockerfile
    environment:
      PORT: "3001"
      MONITOR_SERVICE_URL: http://monitor-service:3000
      CHECK_INTERVAL_MS: "30000"
    ports:
      - "3001:3001"
    depends_on:
      - monitor-service

volumes:
  pulse_pg_data:
