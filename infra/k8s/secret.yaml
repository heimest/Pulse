apiVersion: v1
kind: Secret
metadata:
  name: pulse-postgres-secret
  labels:
    app: postgres
    app.kubernetes.io/part-of: pulse
type: Opaque
stringData:
  POSTGRES_USER: pulse
  POSTGRES_PASSWORD: pulse
  # Used by monitor-service; host "postgres" resolves via the cluster DNS.
  DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse
