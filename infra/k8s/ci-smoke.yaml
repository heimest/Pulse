# Lightweight Minikube smoke stack (no Istio) for CI, inspired by the course TP.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-postgres-config
data:
  POSTGRES_DB: pulse
---
apiVersion: v1
kind: Secret
metadata:
  name: pulse-postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: pulse
  POSTGRES_PASSWORD: pulse
  DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: pulse-postgres-secret
            - configMapRef:
                name: pulse-postgres-config
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-service
  labels:
    app: monitor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-service
  template:
    metadata:
      labels:
        app: monitor-service
    spec:
      containers:
        - name: monitor-service
          image: pulse/monitor-service:ci
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pulse-postgres-secret
                  key: DATABASE_URL
            # Saga is optional in CI smoke; point at a local placeholder.
            - name: CHECKER_GRPC_URL
              value: "127.0.0.1:50051"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-service
  labels:
    app: monitor-service
spec:
  type: NodePort
  selector:
    app: monitor-service
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
